packages:
  - "api"
  - "mobile"
  - "web"
  - "packages/*"
virtualStoreDir: ".vs"
# qs (transitive via express/express-rate-limit) has two moderate DoS CVEs
# fixed in 6.16.0 — safe, mature API, no breaking changes expected. Left out
# a similar override for the `uuid` CVE flagged in a security review
# (transitive via firebase-admin's gaxios, and separately via mobile's old
# Expo/xcode build tooling): the vulnerable code path only triggers when a
# caller passes a custom `buf` argument to uuid v3/v5/v6, which none of our
# dependencies do internally — low practical risk — while forcing uuid to
# the >=11.1.1 patched line would jump mobile's xcode@3.0.1 (pinned to
# uuid@7, a different major API) several majors and risk breaking its
# already-fragile native build tooling for a legacy app being phased out.
overrides:
  qs: ^6.16.0
  "@grpc/grpc-js": ^1.14.5
  "brace-expansion@2": ^2.1.6
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  puppeteer: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - eslint-config-next@16.3.3
  - next@16.3.3
