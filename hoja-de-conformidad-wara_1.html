.print-header .logo{font-weight:800;color:var(--primary);font-size:18px;}
</style>

<script>
/* ============================= DATA LAYER (IndexedDB) ============================= */
const DB_NAME = 'wara_conformidad_db';
const DB_VERSION = 1;
const STORE = 'records';
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, {keyPath:'id'});
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}

async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const store = tx.objectStore(STORE);
    const req = store.getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbGet(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbPut(record){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(record);
    tx.oncomplete = ()=> resolve(record);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ============================= UTILS ============================= */
function uuid(){
  return 'r-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null? undefined : o[k]), obj);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    if(cur[parts[i]] === undefined || cur[parts[i]] === null) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length-1]] = value;
}
function nowLocalDate(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function nowLocalTime(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDateTime(dateStr, timeStr){
  if(!dateStr) return '—';
  return dateStr + (timeStr? ' '+timeStr : '');
}
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}
function resizeImage(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const EQUIP_CHECK_FIELDS = [
  {key:'controlRevisionIgnicion', label:'Revisión de ignición'},

/* ============================= APP STATE / ROUTER ============================= */
let currentRecord = null; // in-memory copy being edited
let sigPad = null; // active signature pad instance
let saveDebounceTimer = null;

function route(){
  const hash = location.hash || '#/home';
  const parts = hash.replace('#/','').split('/');
  const view = parts[0] || 'home';
  const id = parts[1];
  if(view==='pre') renderFormPre(id);
  else if(view==='post') renderFormPost(id);
  else if(view==='print') renderPrint(id);
  else renderHome();
}
window.addEventListener('hashchange', route);

function goto(hash){ location.hash = hash; }

/* ============================= HOME ============================= */
let homeFilter = 'todos';
let homeSearch = '';

async function renderHome(){
  const app = document.getElementById('app');
  const all = await dbGetAll();
  all.sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));

  const filtered = all.filter(r=>{
    if(homeFilter==='pre' && r.status!=='borrador_pre') return false;
    if(homeFilter==='post' && r.status!=='pendiente_post') return false;
    if(homeFilter==='done' && r.status!=='completo') return false;
    if(homeSearch){
      const s = homeSearch.toLowerCase();
      const hay = `${r.cliente} ${r.matricula} ${r.instalador} ${r.numero}`.toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });

  const counts = {
    todos: all.length,
    pre: all.filter(r=>r.status==='borrador_pre').length,
    post: all.filter(r=>r.status==='pendiente_post').length,
    done: all.filter(r=>r.status==='completo').length,
  };

  app.innerHTML = `
    <div class="topbar">
      <h1>Hoja de Conformidad<span class="sub">WARA · Seguimiento y Control</span></h1>
      <button class="back" id="btnBackup" title="Respaldo">⇄</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar por cliente, matrícula, instalador..." value="${esc(homeSearch)}">
    </div>
    <div class="tabs">
      <button class="tab ${homeFilter==='todos'?'active':''}" data-f="todos">Todos (${counts.todos})</button>
      <button class="tab ${homeFilter==='pre'?'active':''}" data-f="pre">En PRE (${counts.pre})</button>
      <button class="tab ${homeFilter==='post'?'active':''}" data-f="post">Pendiente POST (${counts.post})</button>
      <button class="tab ${homeFilter==='done'?'active':''}" data-f="done">Completos (${counts.done})</button>
    </div>
    <div class="content" id="listWrap"></div>
    <button class="fab" id="btnNew">+ Nuevo servicio</button>
  `;

  const listWrap = document.getElementById('listWrap');
  if(filtered.length===0){
    listWrap.innerHTML = `<div class="empty">No hay servicios para mostrar.<br>Tocá "Nuevo servicio" para empezar.</div>`;
  } else {
    listWrap.innerHTML = filtered.map(r=>{
      let badge = '';
      let actions = '';
      if(r.status==='borrador_pre'){
        badge = `<span class="badge badge-pre">PRE en progreso</span>`;
        actions = `<button class="btn btn-primary" data-act="pre" data-id="${r.id}">Continuar PRE</button>`;
      } else if(r.status==='pendiente_post'){
        badge = `<span class="badge badge-post">Pendiente POST</span>`;
        actions = `<button class="btn btn-primary" data-act="post" data-id="${r.id}">Completar POST</button>
                   <button class="btn btn-outline" data-act="print" data-id="${r.id}">Ver</button>`;
      } else {
        badge = `<span class="badge badge-done">Completo</span>`;

function openBackupModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>Respaldo de datos</h3>
      <p>Exportá todos los servicios guardados a un archivo, o importá un respaldo anterior (por ejemplo para pasar los datos a otro celular).</p>
      <button class="btn btn-primary btn-block" id="btnExportAll">Exportar respaldo (.json)</button>
      <div style="height:8px"></div>
      <label class="btn btn-secondary btn-block" style="display:block;text-align:center;cursor:pointer;">
        Importar respaldo (.json)
        <input type="file" accept="application/json" id="importFile" style="display:none;">
      </label>
      <div style="height:8px"></div>
      <button class="btn btn-ghost btn-block" id="btnCloseModal">Cerrar</button>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#btnCloseModal').onclick = ()=> bg.remove();
  bg.querySelector('#btnExportAll').onclick = async ()=>{
    const all = await dbGetAll();
    const blob = new Blob([JSON.stringify({app:'wara-conformidad', exportedAt:new Date().toISOString(), records:all}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `respaldo_conformidad_${nowLocalDate()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Respaldo exportado');
  };
  bg.querySelector('#importFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const records = Array.isArray(data) ? data : (data.records || []);
      if(!records.length){ toast('El archivo no tiene registros'); return; }
      if(!confirm(`Se importarán ${records.length} servicio(s). Los que ya existan (mismo ID) se sobrescribirán. ¿Continuar?`)) return;
      for(const r of records){ await dbPut(r); }
      toast('Importación completa');
      bg.remove();
      renderHome();
    }catch(err){
      alert('No se pudo leer el archivo de respaldo. Verificá que sea un JSON exportado desde esta app.');
    }
  };
}

/* ============================= SIGNATURE PAD ============================= */
function initSignaturePad(canvas, existingDataUrl){
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#26201f';
    if(existingDataUrl){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = existingDataUrl;
    }
  }
  resize();
  let drawing = false, hasDrawn = !!existingDataUrl;
  const emptyMsg = canvas.parentElement.querySelector('.sig-empty-msg');
  function updateEmptyMsg(){ if(emptyMsg) emptyMsg.style.display = hasDrawn ? 'none' : 'block'; }
  updateEmptyMsg();
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx, y:cy};
  }
  function start(e){ e.preventDefault(); drawing = true; hasDrawn = true; updateEmptyMsg(); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(e){ drawing = false; }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  return {
    clear(){ const rect = canvas.getBoundingClientRect(); ctx.clearRect(0,0,rect.width,rect.height); hasDrawn=false; updateEmptyMsg(); },
    isEmpty(){ return !hasDrawn; },
    toDataURL(){ return canvas.toDataURL('image/png'); },
  };
}

/* ============================= CHECKLIST RENDERING ============================= */
function renderChecklistHTML(record, phase){
  let html = '';
  let lastGroup = null;
  CHECKLIST_ITEMS.forEach(item=>{
    if(item.group && item.group !== lastGroup){
      html += `<div class="checklist-group-title">${esc(item.group)}</div>`;
      lastGroup = item.group;
    }
    const val = getPath(record, `${phase}.checklist.${item.key}`);
    html += `
      <div class="checklist-item">
        <div class="checklist-label">${esc(item.label)}</div>
        ${item.note? `<div class="checklist-note">${esc(item.note)}</div>` : ''}
        <div class="toggle-group" data-path="${phase}.checklist.${item.key}">
          <button type="button" class="toggle-btn si ${val==='SI'?'active':''}" data-value="SI">SÍ</button>
          <button type="button" class="toggle-btn no ${val==='NO'?'active':''}" data-value="NO">NO</button>
        </div>
      </div>`;
  });
  return html;
}
function wireChecklist(container, record, phase, onChange){
  container.querySelectorAll('.toggle-group').forEach(group=>{
    const path = group.dataset.path;
    group.querySelectorAll('.toggle-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const val = btn.dataset.value;
        const current = getPath(record, path);
        setPath(record, path, current===val ? null : val);
        group.querySelectorAll('.toggle-btn').forEach(b=>{
          b.classList.toggle('active', getPath(record,path)===b.dataset.value);
        });
        onChange();
      };
    });
  });
}

/* ============================= PHOTOS ============================= */
function renderPhotoGridHTML(fotos){
  let html = '<div class="photo-grid">';
  (fotos||[]).forEach((f,idx)=>{
    html += `<div class="photo-thumb"><img src="${f.dataUrl}"><button class="del" data-idx="${idx}">×</button></div>`;
  });
  html += `<label class="photo-add">
      <input type="file" accept="image/*" capture="environment" style="display:none" class="photoInput">
      <span style="font-size:20px;">＋</span><span>Agregar foto</span>
    </label>`;
  html += '</div>';
  return html;
}
function wirePhotoGrid(container, fotosArrRef, onChange){
  container.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = ()=>{
      fotosArrRef.splice(Number(btn.dataset.idx),1);
      onChange();
    };
  });
  const input = container.querySelector('.photoInput');
  if(input){
    input.onchange = async ()=>{
      const file = input.files[0];
      if(!file) return;
      toast('Procesando foto...');
      try{
        const dataUrl = await resizeImage(file);
        fotosArrRef.push({id: uuid(), dataUrl});
        onChange();
      }catch(e){ toast('No se pudo procesar la foto'); }
    };
  }
}

  };
  document.getElementById('btnShare').onclick = async ()=>{
    const text = `Hoja de Conformidad WARA\nCliente: ${record.cliente}\nMatrícula: ${record.matricula}\nFecha: ${fmtDateTime(record.fecha,record.hora)}\nInstalador: ${record.instalador}\nEstado: ${statusLabel}`;
    if(navigator.share){
      try{ await navigator.share({title:'Hoja de Conformidad', text}); }
      catch(e){ /* usuario canceló */ }
    } else {
      try{ await navigator.clipboard.writeText(text); toast('Resumen copiado al portapapeles'); }
      catch(e){ alert(text); }
    }
  };
}

/* ============================= INIT ============================= */
route();
</script>
</body>
